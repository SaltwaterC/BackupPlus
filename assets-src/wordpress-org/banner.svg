<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1544 500" width="1544" height="500" role="img" aria-label="BackupPlus">
<defs>
	<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
		<stop offset="0" stop-color="#25496b"/>
		<stop offset="1" stop-color="#152a3e"/>
	</linearGradient>
	<radialGradient id="glow" cx="0.18" cy="0.45" r="0.6">
		<stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
		<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
	</radialGradient>
	<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
		<path d="M 40 0 H 0 V 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
	</pattern>
</defs>

<rect width="1544" height="500" fill="url(#bg)"/>
<rect width="1544" height="500" fill="url(#grid)"/>
<rect width="1544" height="500" fill="url(#glow)"/>

<!-- A large, faint plus: the brand's accent -->
<path d="M 1440,-40 V 290 M 1280,125 H 1600" stroke="#75c46b" stroke-opacity="0.08" stroke-width="96" stroke-linecap="round" fill="none"/>

<!-- The mark, inverted for the dark ground -->
<g transform="translate(120 142) scale(4.5)">
	<rect width="48" height="48" rx="11" fill="#ffffff"/>
	<path d="M 10.5,9.5 H 22.8 C 29.5,9.5 32.6,13.4 32.6,19.2 C 32.6,22.3 31.0,25.0 28.2,26.5 C 32.9,27.8 35.4,30.9 35.4,35.0 C 35.4,41.1 31.2,44 23.8,44 H 10.5 Z M 17.5,15.7 V 23.7 H 22.5 C 25.4,23.7 26.9,22.3 26.9,19.7 C 26.9,17.1 25.5,15.7 22.5,15.7 Z M 17.5,30 V 38.6 H 23.5 C 27.3,38.6 29.2,37.2 29.2,34.3 C 29.2,31.5 27.3,30 23.5,30 Z" fill="#1f3b57" fill-rule="evenodd"/>
	<path d="M 38.5,8 V 18.6 M 34,13.3 H 43" stroke="#4f9e48" stroke-width="3.6" stroke-linecap="round" fill="none"/>
</g>

<text x="392" y="236" fill="#ffffff" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="124" font-weight="700" letter-spacing="-1">Backup<tspan fill="#75c46b">Plus</tspan></text>
<text font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="33" fill="#c8d6e4">
	<tspan x="396" y="302">Scheduled, encrypted backups to local or cloud storage.</tspan>
	<tspan x="396" y="348">Restore, migrate, and recover the database to any point in time.</tspan>
</text>

<!-- A backup timeline: snapshots, then now -->
<g transform="translate(396 420)">
	<line x1="0" y1="0" x2="1000" y2="0" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round"/>
	<g fill="#ffffff" fill-opacity="0.4">
		<circle cx="0" cy="0" r="7"/>
		<circle cx="140" cy="0" r="7"/>
		<circle cx="280" cy="0" r="7"/>
		<circle cx="420" cy="0" r="7"/>
		<circle cx="560" cy="0" r="7"/>
		<circle cx="700" cy="0" r="7"/>
		<circle cx="840" cy="0" r="7"/>
	</g>
	<circle cx="1000" cy="0" r="20" fill="#75c46b" fill-opacity="0.25"/>
	<circle cx="1000" cy="0" r="10" fill="#75c46b"/>
</g>
</svg>
